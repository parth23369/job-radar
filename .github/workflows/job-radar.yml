name: Job Radar

on:
  schedule:
    # 03:45 UTC = 09:15 IST. GitHub may start scheduled runs a few minutes late,
    # so the mail usually arrives between 9:15 and 10:00 AM.
    - cron: "45 3 * * *"
  workflow_dispatch:        # "Run workflow" button, for testing
    inputs:
      weekly:
        description: "Also send the weekly report now"
        type: boolean
        default: false
      dry_run:
        description: "Test run: send no digest and save nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency: job-radar      # never run two at once (would double-send)

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  radar:
    needs: test             # a failing test stops the run, and the alert job tells you
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write       # lets this job commit data/seen.json and data/jobs/
    env:
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --no-audit --no-fund

      - name: Refresh discovered boards (1st of every month)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(TZ=Asia/Kolkata date +%d)" = "01" ]; then
            node scripts/discover-boards.mjs
          else
            echo "Not the 1st; keeping current discovered boards."
          fi

      - name: Daily digest
        id: daily
        run: |
          # Exit code 2 means the run finished but failed the health check.
          # Carry on (weekly report, saving state) and fail the job in the last step.
          code=0
          node src/daily.mjs $DRY_RUN_FLAG || code=$?
          if [ "$code" = "2" ]; then
            echo "unhealthy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Weekly report (Sundays, or when requested)
        if: ${{ inputs.weekly || github.event_name == 'schedule' }}
        run: |
          if [ "${{ inputs.weekly }}" = "true" ] || [ "$(TZ=Asia/Kolkata date +%u)" = "7" ]; then
            node src/weekly.mjs $DRY_RUN_FLAG
          else
            echo "Not Sunday in IST; skipping weekly report."
          fi

      - name: Keep the dry-run mail for download
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-mail
          path: out/

      - name: Save what was sent (for de-duplication and the weekly report)
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Kolkata date +%F)"
          git push

      - name: Fail the run if the health check failed
        if: ${{ steps.daily.outputs.unhealthy == 'true' }}
        run: |
          echo "::error::Health check failed. Search the Daily digest log for 'Health check failed'."
          exit 1

  alert:
    needs: [test, radar]
    # Covers failed tests, crashes, failed health checks and time-outs.
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      TEST_RESULT: ${{ needs.test.result }}
      RADAR_RESULT: ${{ needs.radar.result }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: node scripts/alert.mjs
